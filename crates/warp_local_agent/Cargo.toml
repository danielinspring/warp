[package]
name = "warp_local_agent"
version = "0.1.0"
edition = "2024"
authors.workspace = true
publish.workspace = true
license.workspace = true
description = "Standalone local agent service speaking Warp's multi-agent protocol over HTTP+SSE"

[[bin]]
name = "warp-local-agent"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
async-stream.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
futures.workspace = true
image.workspace = true
local_agent_runtime.workspace = true
prost.workspace = true
prost-types.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "net",
  "sync",
  "time",
  "fs",
  "io-util",
  "signal",
] }
tower-http = { workspace = true, features = ["trace"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }
url.workspace = true
urlencoding = "2.1.3"
uuid.workspace = true
warp_multi_agent_api.workspace = true
warp_util.workspace = true

[dev-dependencies]
command.workspace = true
field_mask.workspace = true
tempfile.workspace = true
