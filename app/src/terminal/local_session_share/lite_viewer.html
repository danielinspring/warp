<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Warp local session share</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2300a2d8'/%3E%3Cpath d='M4 5l2.5 3L4 11' stroke='white' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M8.5 11h3.5' stroke='white' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <style>
      /* Palette mirrors app/src/themes/default_themes.rs (Light / Dark). */
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1b1b1f;
        --muted: #6b7280;
        --faint: #9aa1ab;
        --line: #e7e9ec;
        --hover: #f7f8fa;
        --chrome-bg: #f4f5f7;
        --accent: #00a2d8;
        --ok: #10a778;
        --err: #d1264c;
        --chip: #eceef1;
        --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas,
          "Liberation Mono", monospace;

        --a0: #212121;
        --a1: #c30771;
        --a2: #10a778;
        --a3: #a89c14;
        --a4: #008ec4;
        --a5: #523c79;
        --a6: #20a5ba;
        --a7: #e0e0e0;
        --a8: #212121;
        --a9: #fb007a;
        --a10: #5fd7af;
        --a11: #f3e430;
        --a12: #20bbfc;
        --a13: #6855de;
        --a14: #4fb8cc;
        --a15: #f1f1f1;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0c0e;
          --fg: #f1f1f1;
          --muted: #8b949e;
          --faint: #6a727c;
          --line: #1e2126;
          --hover: #131519;
          --chrome-bg: #101216;
          --accent: #19aad8;
          --ok: #b4fa72;
          --err: #ff8272;
          --chip: #1b1e24;

          --a0: #616161;
          --a1: #ff8272;
          --a2: #b4fa72;
          --a3: #fefdc2;
          --a4: #a5d5fe;
          --a5: #ff8ffd;
          --a6: #d0d1fe;
          --a7: #f1f1f1;
          --a8: #8e8e8e;
          --a9: #ffc4bd;
          --a10: #d6fcb9;
          --a11: #fefdd5;
          --a12: #c1e3fe;
          --a13: #ffb1fe;
          --a14: #e5e6fe;
          --a15: #feffff;
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
      }

      body {
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.45 var(--mono);
        -webkit-font-smoothing: antialiased;
      }

      #chrome {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 10px;
        height: 40px;
        padding: 0 14px;
        border-bottom: 1px solid var(--line);
        background: var(--chrome-bg);
        user-select: none;
      }
      #chrome h1 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      #chrome .grow {
        flex: 1 1 auto;
      }
      #title {
        color: var(--muted);
        max-width: 40vw;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 22px;
        padding: 0 9px;
        border-radius: 11px;
        background: var(--chip);
        color: var(--muted);
        font-size: 11px;
        white-space: nowrap;
      }
      #status .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--faint);
      }
      #status.ok .dot {
        background: var(--ok);
        animation: pulse 2s ease-in-out infinite;
      }
      #status.err .dot {
        background: var(--err);
      }
      @keyframes pulse {
        50% {
          opacity: 0.35;
        }
      }

      #blocks {
        flex: 1 1 auto;
        overflow: auto;
        overscroll-behavior: contain;
      }

      .block {
        position: relative;
        padding: 9px 16px 11px 16px;
        border-bottom: 1px solid var(--line);
      }
      .block:hover {
        background: var(--hover);
      }
      .block::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 2px;
        background: transparent;
      }
      .block[data-state="fail"]::before {
        background: var(--err);
      }
      .block[data-state="running"]::before {
        background: var(--accent);
      }

      .bhead {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 16px;
        margin-bottom: 3px;
        font-size: 11.5px;
        color: var(--muted);
      }
      .bhead .cwd {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .bhead .git::before {
        content: "⑂ ";
      }
      .bhead .grow {
        flex: 1 1 auto;
      }
      .bhead .exit {
        color: var(--err);
      }
      .bhead .live {
        color: var(--accent);
      }
      .acts {
        display: flex;
        gap: 4px;
        opacity: 0;
        transition: opacity 0.1s ease-in;
      }
      .block:hover .acts,
      .acts:focus-within {
        opacity: 1;
      }
      .acts button {
        font: inherit;
        font-size: 11px;
        color: var(--muted);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 0 6px;
        height: 18px;
        cursor: pointer;
      }
      .acts button:hover {
        color: var(--fg);
        border-color: var(--faint);
      }

      .bcmd {
        font-weight: 600;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .bout {
        margin-top: 3px;
      }
      .bout:empty {
        display: none;
      }
      .ln {
        white-space: pre-wrap;
        word-break: break-word;
        min-height: 1.45em;
      }
      .notice {
        color: var(--muted);
        font-style: italic;
      }

      /* Agent Mode turns. These never touch the PTY, so they arrive as plain
         text snapshots rather than as parsed terminal output. */
      .block.agent .bcmd::before {
        content: "agent";
        display: inline-block;
        margin-right: 8px;
        padding: 0 6px;
        border: 1px solid var(--accent);
        border-radius: 5px;
        color: var(--accent);
        font-size: 11px;
        font-weight: 600;
        vertical-align: 1px;
      }
      .agentout {
        margin-top: 6px;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 13.5px;
        line-height: 1.55;
        color: var(--fg);
        word-break: break-word;
      }
      .agentout:empty::before {
        content: "thinking…";
        color: var(--faint);
        font-style: italic;
        font-family: var(--mono);
      }
      .agentout > :first-child {
        margin-top: 0;
      }
      .agentout > :last-child {
        margin-bottom: 0;
      }
      .agentout h1,
      .agentout h2,
      .agentout h3,
      .agentout h4 {
        margin: 0.9em 0 0.35em;
        font-weight: 700;
        line-height: 1.3;
        color: var(--fg);
      }
      .agentout h1 {
        font-size: 1.35em;
      }
      .agentout h2 {
        font-size: 1.2em;
      }
      .agentout h3 {
        font-size: 1.08em;
      }
      .agentout h4 {
        font-size: 1em;
      }
      .agentout p {
        margin: 0.45em 0;
      }
      .agentout ul,
      .agentout ol {
        margin: 0.4em 0;
        padding-left: 1.4em;
      }
      .agentout li {
        margin: 0.15em 0;
      }
      .agentout li > ul,
      .agentout li > ol {
        margin: 0.1em 0;
      }
      .agentout strong {
        font-weight: 700;
      }
      .agentout em {
        font-style: italic;
      }
      .agentout code {
        font-family: var(--mono);
        font-size: 0.92em;
        background: var(--chip);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 0.05em 0.35em;
      }
      .agentout pre {
        margin: 0.55em 0;
        padding: 8px 10px;
        overflow: auto;
        background: var(--chip);
        border: 1px solid var(--line);
        border-radius: 6px;
        font-family: var(--mono);
        font-size: 12.5px;
        line-height: 1.45;
        white-space: pre;
      }
      .agentout pre code {
        background: transparent;
        border: 0;
        padding: 0;
        font-size: inherit;
      }
      .agentout a {
        color: var(--accent);
        text-decoration: underline;
      }
      .agentout blockquote {
        margin: 0.5em 0;
        padding: 0.15em 0 0.15em 0.85em;
        border-left: 3px solid var(--line);
        color: var(--muted);
      }
      .agentout hr {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 0.8em 0;
      }
      .divider {
        padding: 6px 16px;
        color: var(--faint);
        font-size: 11.5px;
        border-bottom: 1px solid var(--line);
      }
      .divider.history {
        text-align: center;
        position: sticky;
        top: 0;
        background: var(--bg);
        z-index: 1;
      }
      .divider.history.more {
        cursor: pointer;
        color: var(--accent);
      }
      .divider.history.more:hover {
        background: var(--hover);
      }

      /* Alternate screen: a fixed grid that takes over the whole view while a
         full-screen app owns the host terminal. */
      #screen {
        display: none;
        flex: 1 1 auto;
        overflow: hidden;
        padding: 6px 8px;
        line-height: 1.2;
      }
      body.alt #screen {
        display: block;
      }
      body.alt #blocks,
      body.alt #footer,
      body.alt #guestbar,
      body.alt #jump {
        display: none;
      }
      .srow {
        white-space: pre;
        height: 1.2em;
      }
      .cur {
        background: var(--fg);
        color: var(--bg);
      }
      .pill.hidden {
        display: none;
      }

      #footer {
        flex: 0 0 auto;
        border-top: 1px solid var(--line);
        background: var(--chrome-bg);
        padding: 8px 16px;
        max-height: 30vh;
        overflow: auto;
        color: var(--muted);
      }
      #footer.hidden {
        display: none;
      }
      #caret {
        display: inline-block;
        width: 7px;
        height: 1.1em;
        vertical-align: text-bottom;
        background: var(--accent);
        opacity: 0.7;
        animation: pulse 1.1s steps(1, end) infinite;
      }
      #typed {
        white-space: pre-wrap;
        word-break: break-word;
        font-weight: 600;
        color: var(--muted);
      }

      /* The guest's own command line. Deliberately a sibling of #footer and
         never re-parented by a render pass: moving a focused contenteditable
         node blurs it, which is why the host mirror above cannot double as the
         guest's input. */
      #guestbar {
        flex: 0 0 auto;
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 9px 16px;
        border-top: 1px solid var(--line);
        background: var(--chrome-bg);
        cursor: text;
      }
      #guestbar.off {
        display: none;
      }
      #gsigil {
        color: var(--accent);
        font-weight: 600;
      }
      #ginput {
        flex: 1 1 auto;
        white-space: pre-wrap;
        word-break: break-word;
        color: var(--fg);
        outline: none;
        min-height: 1.2em;
      }
      #ginput:empty::before {
        content: attr(data-placeholder);
        color: var(--faint);
      }
      #ghint {
        flex: 0 0 auto;
        color: var(--faint);
        font-size: 11.5px;
      }

      #jump {
        position: fixed;
        right: 18px;
        bottom: 64px;
        display: none;
        align-items: center;
        gap: 6px;
        height: 28px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--chrome-bg);
        color: var(--fg);
        font: inherit;
        font-size: 11.5px;
        cursor: pointer;
        box-shadow: 0 2px 10px rgb(0 0 0 / 18%);
      }
      #jump.show {
        display: inline-flex;
      }

      #join {
        position: fixed;
        inset: 40px 0 0 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        z-index: 5;
      }
      #join.hidden {
        display: none;
      }
      .jcard {
        width: min(420px, 82vw);
      }
      .jrow {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .jmeta {
        margin-top: 6px;
        color: var(--faint);
        font-size: 11.5px;
      }
      .jrow .grow {
        flex: 1 1 auto;
      }
      #jphase {
        font-weight: 600;
      }
      #jpct {
        font-variant-numeric: tabular-nums;
        color: var(--muted);
      }
      #jtime {
        font-variant-numeric: tabular-nums;
      }
      #jbar {
        margin-top: 8px;
        height: 4px;
        border-radius: 2px;
        background: var(--chip);
        overflow: hidden;
      }
      #jfill {
        height: 100%;
        width: 0;
        border-radius: 2px;
        background: var(--accent);
        transition: width 0.18s ease-out;
      }
      #join.err #jfill {
        background: var(--err);
      }
      #join.err #jphase {
        color: var(--err);
      }
    </style>
  </head>
  <body>
    <div id="chrome">
      <h1>Local session share</h1>
      <span class="pill" id="status"><span class="dot"></span
        ><span id="status-text">connecting…</span></span>
      <span id="title"></span>
      <span class="grow"></span>
      <span class="pill hidden" id="mode">full-screen app</span>
      <span class="pill" id="size"></span>
      <span class="pill" id="acl">interactive</span>
    </div>

    <div id="blocks"></div>
    <div id="screen"></div>

    <div id="join">
      <div class="jcard">
        <div class="jrow">
          <span id="jphase">Connecting…</span>
          <span class="grow"></span>
          <span id="jpct">0%</span>
        </div>
        <div id="jbar"><div id="jfill"></div></div>
        <div class="jrow jmeta">
          <span id="jdetail"></span>
          <span class="grow"></span>
          <span id="jtime">0.0s</span>
        </div>
      </div>
    </div>

    <div id="footer" class="hidden">
      <div id="prompt"></div>
      <span id="input"><span id="typed"></span><span id="caret"></span></span>
    </div>

    <div id="guestbar" class="off">
      <span id="gsigil">❯</span>
      <span
        id="ginput"
        contenteditable="true"
        spellcheck="false"
        role="textbox"
        aria-label="Run a command on the host"
        data-placeholder="run a command on the host…"
      ></span>
      <span id="ghint">Enter to run</span>
    </div>

    <button id="jump" type="button">↓ Jump to live</button>

    <script>
      // View-only guest for the local LAN share hub, used when a full Warp WASM
      // bundle is not staged. It speaks session-sharing-protocol over same-origin
      // WS (PTY bytes are LZ4 size-prepended, matching lz4_flex), and rebuilds
      // Warp's block UI on the client:
      //
      //   * Scrollback blocks arrive as JSON `SerializedBlock`s. The full list is
      //     kept client-side; only the newest few mount into the DOM at join, and
      //     scrolling up pages in older ones.
      //   * Live output is a raw PTY stream, so we parse it here: Warp's shell
      //     hooks (DCS `ESC P $ d <hex> ST` / OSC 9278) carry Preexec, Precmd and
      //     CommandFinished, which is exactly what the client itself uses to cut
      //     the stream into blocks.
      //   * Full-screen apps (vim, claude, top) switch to the alternate screen,
      //     which addresses cells absolutely and so cannot live in the block
      //     model. Those get a real fixed grid (`Screen`) that takes over the
      //     view until the app exits.
      (function () {
        "use strict";

        var MAX_BLOCKS = 400;
        var MAX_LINES = 4000;
        var MAX_PROMPT_LINES = 60;
        var MAX_COLS = 20000;
        // History arrives all at once on join, but mounting every block into the
        // DOM up front is wasteful. Show a short tail first and reveal older
        // pages when the guest scrolls up.
        var INITIAL_VISIBLE_BLOCKS = 3;
        var HISTORY_PAGE_SIZE = 5;
        var SUCCESS_EXIT_CODES = [0, 130, 141, -1073741510];

        /* ----------------------------------------------------------------- */
        /* Small helpers                                                      */
        /* ----------------------------------------------------------------- */

        function escapeHtml(text) {
          return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
        }

        function bytesFromJson(value) {
          if (typeof value === "string") {
            var bin = atob(value);
            var out = new Uint8Array(bin.length);
            for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
            return out;
          }
          var bytes = new Uint8Array(value.length);
          for (var j = 0; j < value.length; j++) bytes[j] = value[j] & 0xff;
          return bytes;
        }

        function decodeUtf8(bytes) {
          return new TextDecoder("utf-8", { fatal: false }).decode(bytes);
        }

        // Share URLs are plain http on the LAN, which is not a secure context,
        // so `crypto.randomUUID` is unavailable in Chrome. The id only has to be
        // unique per guest, so fall back to `getRandomValues` (or `Math.random`).
        function randomUuid() {
          var webCrypto = window.crypto || window.msCrypto;
          if (webCrypto && typeof webCrypto.randomUUID === "function") {
            return webCrypto.randomUUID();
          }
          var bytes = new Uint8Array(16);
          if (webCrypto && typeof webCrypto.getRandomValues === "function") {
            webCrypto.getRandomValues(bytes);
          } else {
            for (var i = 0; i < 16; i++) {
              bytes[i] = Math.floor(Math.random() * 256);
            }
          }
          bytes[6] = (bytes[6] & 0x0f) | 0x40;
          bytes[8] = (bytes[8] & 0x3f) | 0x80;
          var hex = "";
          for (var j = 0; j < 16; j++) {
            hex += (bytes[j] + 0x100).toString(16).slice(1);
          }
          return [
            hex.slice(0, 8),
            hex.slice(8, 12),
            hex.slice(12, 16),
            hex.slice(16, 20),
            hex.slice(20),
          ].join("-");
        }

        function hexToString(hex) {
          var bytes = new Uint8Array(hex.length >> 1);
          for (var i = 0; i < bytes.length; i++) {
            bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
          }
          return decodeUtf8(bytes);
        }

        function copyText(text) {
          if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).catch(function () {});
            return;
          }
          // Share URLs are plain http on the LAN, so the async clipboard API is
          // usually unavailable; fall back to the legacy path.
          var area = document.createElement("textarea");
          area.value = text;
          area.setAttribute("readonly", "");
          area.style.position = "fixed";
          area.style.opacity = "0";
          document.body.appendChild(area);
          area.select();
          try {
            document.execCommand("copy");
          } catch (err) {
            /* ignore */
          }
          document.body.removeChild(area);
        }

        // Minimal LZ4 block decoder (size-prepended = u32 LE uncompressed len).
        function lz4DecompressSizePrepended(bytes) {
          if (bytes.length < 4) throw new Error("lz4 input too short");
          var size =
            bytes[0] | (bytes[1] << 8) | (bytes[2] << 16) | (bytes[3] << 24);
          return lz4BlockDecode(bytes.subarray(4), size >>> 0);
        }

        function lz4BlockDecode(src, uncompressedSize) {
          var dst = new Uint8Array(uncompressedSize);
          var s = 0;
          var d = 0;
          while (s < src.length) {
            var token = src[s++];
            var litLen = token >>> 4;
            if (litLen === 15) {
              var lb;
              do {
                lb = src[s++];
                litLen += lb;
              } while (lb === 255);
            }
            for (var i = 0; i < litLen; i++) dst[d++] = src[s++];
            if (s >= src.length) break;
            var offset = src[s++] | (src[s++] << 8);
            if (offset === 0) throw new Error("lz4 invalid offset");
            var matchLen = (token & 0xf) + 4;
            if ((token & 0xf) === 15) {
              var mb;
              do {
                mb = src[s++];
                matchLen += mb;
              } while (mb === 255);
            }
            var matchPos = d - offset;
            for (var m = 0; m < matchLen; m++) dst[d++] = dst[matchPos++];
          }
          if (d !== uncompressedSize) throw new Error("lz4 size mismatch");
          return dst;
        }

        /* ----------------------------------------------------------------- */
        /* SGR styles                                                         */
        /* ----------------------------------------------------------------- */

        // Style 0 is "no styling at all" and renders without a wrapping span.
        var styleList = [null];
        var styleKeys = { "": 0 };
        var styleCss = [""];

        function defaultStyle() {
          return {
            fg: null,
            bg: null,
            bold: false,
            dim: false,
            italic: false,
            underline: false,
            strike: false,
            inverse: false,
          };
        }

        function styleKeyOf(style) {
          if (
            style.fg === null &&
            style.bg === null &&
            !style.bold &&
            !style.dim &&
            !style.italic &&
            !style.underline &&
            !style.strike &&
            !style.inverse
          ) {
            return "";
          }
          return [
            style.fg,
            style.bg,
            style.bold ? 1 : 0,
            style.dim ? 1 : 0,
            style.italic ? 1 : 0,
            style.underline ? 1 : 0,
            style.strike ? 1 : 0,
            style.inverse ? 1 : 0,
          ].join("|");
        }

        function cube(value) {
          return value === 0 ? 0 : 55 + value * 40;
        }

        function xterm256(index) {
          if (index < 16) return "var(--a" + index + ")";
          if (index < 232) {
            var n = index - 16;

                this.dcsInter += ch;

          var hasPrompt = atPrompt && !buffer.isEmpty();
          var hasTyped = session.typedInput.length > 0;
          if (!atPrompt && !hasTyped) {
            footerEl.className = "hidden";
            return;
          }
          footerEl.className = "";
          if (hasPrompt) {
            renderBuffer(promptEl, buffer);
          } else {
            promptEl.textContent = "";
          }
          if (typedEl.textContent !== session.typedInput) {
            typedEl.textContent = session.typedInput;
          }
          // The prompt renders as one block element per row, so the mirrored
          // host text has to live inside the last row to continue on the
          // prompt's line instead of wrapping onto its own. Re-parent on every
          // pass: renderBuffer rewrites the rows it repaints.
          var lastRow = hasPrompt ? promptEl.lastElementChild : null;
          (lastRow || footerEl).appendChild(inputEl);
        }

        /// The guest command line is enabled whenever we are joined and the host
        /// is not in a full-screen app (where raw keystrokes go to the PTY
        /// instead). Enter runs the line; while a command is running it is sent
        /// to the running program's stdin instead.
        function renderGuestBar() {
          var enabled = guest.joined && !session.altScreen;
          guestBarEl.className = enabled ? "" : "off";
          if (!enabled) return;
          var running = session.state === "running";
          ghintEl.textContent = running
            ? "Enter to send · ⌃C to stop"
            : "Enter to run · /agent to ask";
          ginputEl.setAttribute(
            "data-placeholder",
            running
              ? "send input to the running command…"
              : "run a command, or /agent <prompt>…"
          );
        }

        function scrollToBottom() {
          blocksEl.scrollTop = blocksEl.scrollHeight;
        }

        blocksEl.addEventListener("scroll", function () {
          var atBottom =
            blocksEl.scrollTop + blocksEl.clientHeight >= blocksEl.scrollHeight - 12;
          view.following = atBottom;
          jumpEl.className = atBottom ? "" : "show";
          // Near the top: pull in the next page of older history, if any.
          if (blocksEl.scrollTop < 96) {
            loadOlderHistory(HISTORY_PAGE_SIZE);
          }
        });

        // A short history does not overflow the pane, so there is no scrollbar
        // and no scroll event to page on. Wheel events fire either way, so treat
        // "wheel up while already at the top" as a request for the next page.
        blocksEl.addEventListener(
          "wheel",
          function (event) {
            if (event.deltaY >= 0 || blocksEl.scrollTop > 0) return;
            var now = Date.now();
            // One page per flick rather than the whole history in one gesture.
            if (now - history.lastLoadAt < 120) return;
            history.lastLoadAt = now;
            loadOlderHistory(HISTORY_PAGE_SIZE);
          },
          { passive: true }
        );

        jumpEl.addEventListener("click", function () {
          view.following = true;
          jumpEl.className = "";
          scrollToBottom();
        });

        // Keeps the elapsed time on the in-flight block ticking.
        setInterval(function () {
          var block = session.current;
          if (block && block.running && block.el) renderHead(block);
        }, 250);

        /* ----------------------------------------------------------------- */
        /* Session state machine driven by Warp's shell hooks                 */
        /* ----------------------------------------------------------------- */

        var session = {
          state: "idle", // "idle" | "prompt" | "running"
          current: null,
          promptContext: {},
          promptBuffer: new LineBuffer(MAX_PROMPT_LINES),
          scratch: new LineBuffer(MAX_PROMPT_LINES),
          inBandDepth: 0,
          altScreen: false,
          screen: new Screen(24, 80),
          hooksSeen: false,
          // Read-only mirror of the host's Warp input editor.
          typedInput: "",
        };

        // The guest's own input, kept separate from the host mirror above so
        // neither can clobber the other.
        var guest = {
          joined: false,
        };

        var transport = {
          ws: null,
          viewerId: null,
          bufferId: null,
          ptySeq: 0,
        };

        function currentBlock() {
          if (!session.current) {
            var block = new Block("raw");
            session.current = appendBlock(block);
          }
          return session.current;
        }

        function targetBuffer() {
          if (session.altScreen) return session.screen;
          if (session.inBandDepth > 0) return session.scratch;
          if (session.state === "prompt") return session.promptBuffer;
          return currentBlock().buffer;
        }

        function startCommandBlock(command) {
          var block = new Block("command");
          block.command = command;
          block.pwd = session.promptContext.pwd || null;
          block.git = session.promptContext.git || null;
          block.startedAt = Date.now();
          block.running = true;
          session.current = appendBlock(block);
          session.state = "running";
          session.typedInput = "";
          typedEl.textContent = "";
          scheduleRender();
        }

        function finishCommandBlock(exitCode) {
          var block = session.current;
          if (block && block.running) {
            block.running = false;
            block.exitCode = typeof exitCode === "number" ? exitCode : null;
            block.finishedAt = Date.now();
            block.headDirty = true;
          }
          session.state = "idle";
          scheduleRender();
        }

        function onHook(hook) {
          session.hooksSeen = true;
          var value = hook.value || {};
          switch (hook.hook) {
            case "Preexec":
              startCommandBlock(value.command || "");
              break;
            case "CommandFinished":
              finishCommandBlock(value.exit_code);
              break;
            case "Precmd":
              if (value.pwd) session.promptContext.pwd = value.pwd;
              session.promptContext.git =
                value.git_branch || value.git_head || session.promptContext.git;
              session.state = "prompt";
              session.promptBuffer.reset();
              scheduleRender();
              break;
            case "Bootstrapped":
              if (value.home_dir) view.home = value.home_dir;
              break;
            case "Clear":
              clearBlocks();
              break;
            default:
              break;
          }
        }

        function clearBlocks() {
          for (var i = 0; i < view.blocks.length; i++) {
            var el = view.blocks[i].el;
            if (el && el.parentNode) el.parentNode.removeChild(el);
          }
          view.blocks = [];
          session.current = null;
          history.older = [];
          history.atStart = true;
          history.markerEl = null;
          agentBlocks = {};
          blocksEl.textContent = "";
          scheduleRender();
        }

        function onAltScreen(enabled) {
          if (session.altScreen === enabled) return;
          session.altScreen = enabled;
          document.body.className = enabled ? "alt" : "";
          modeEl.className = enabled ? "pill" : "pill hidden";
          if (enabled) {
            session.screen.reset();
            fitScreen();
            ginputEl.blur();
          } else {
            screenEl.textContent = "";
            var block = session.current;
            if (block) {
              // The grid is gone once the app exits, and it was never part of
              // this block's output, so say so rather than leaving it blank.
              block.notice =
                "Full-screen application output is not captured in this block.";
              block.headDirty = true;
            }
          }
          scheduleRender();
        }

        var terminal = new Terminal({
          getBuffer: targetBuffer,
          onHook: onHook,
          onAltScreen: onAltScreen,
          onInBand: function (started) {
            if (started) {
              session.inBandDepth++;
              if (session.current && session.state === "running") {
                session.current.inBand = true;
              }
            } else if (session.inBandDepth > 0) {
              session.inBandDepth--;
            }
          },
          onTitle: function (title) {
            titleEl.textContent = title || "";
          },
        });

        /* ----------------------------------------------------------------- */
        /* Scrollback (SerializedBlock JSON captured when the share started)  */
        /* ----------------------------------------------------------------- */

        function bufferFromAnsi(text, maxLines) {
          var buffer = new LineBuffer(maxLines || MAX_LINES);
          var offscreen = new Terminal({
            getBuffer: function () {
              return buffer;
            },
          });
          offscreen.write(text);
          return buffer;
        }

        function updateHistoryMarker() {
          if (history.markerEl && history.markerEl.parentNode) {
            history.markerEl.parentNode.removeChild(history.markerEl);
          }
          history.markerEl = null;
          if (history.atStart && view.blocks.length === 0 && history.older.length === 0) {
            return;
          }
          var el = document.createElement("div");
          if (history.older.length > 0) {
            el.className = "divider history more";
            el.setAttribute("role", "button");
            el.setAttribute("tabindex", "0");
            el.textContent =
              "↑ load " +
              Math.min(HISTORY_PAGE_SIZE, history.older.length) +
              " older blocks (" +
              history.older.length +
              " left)";
            // Clicking is the fallback for anything that cannot generate a
            // scroll or wheel event here (touch, keyboard-only, short history).
            el.addEventListener("click", function () {
              loadOlderHistory(HISTORY_PAGE_SIZE);
            });
          } else {
            el.className = "divider history";
            el.textContent = "— beginning of shared history —";
            history.atStart = true;
          }
          history.markerEl = el;
          blocksEl.insertBefore(el, blocksEl.firstChild);
        }

        // Mount already-parsed blocks at the front of the list, preserving the
        // guest's scroll anchor so the viewport does not jump.
        function prependBlocks(blocks) {
          if (!blocks.length) return;
          var prevHeight = blocksEl.scrollHeight;
          var prevTop = blocksEl.scrollTop;
          for (var i = blocks.length - 1; i >= 0; i--) {
            view.blocks.unshift(blocks[i]);
          }
          for (var j = 0; j < blocks.length; j++) {
            renderBlock(blocks[j]);
          }
          var delta = blocksEl.scrollHeight - prevHeight;
          blocksEl.scrollTop = prevTop + delta;
        }

        function loadOlderHistory(count) {
          if (history.loading) return;
          if (!history.older.length) {
            if (!history.atStart) {
              history.atStart = true;
              updateHistoryMarker();
            }
            return;
          }
          history.loading = true;
          var take = Math.min(count || HISTORY_PAGE_SIZE, history.older.length);
          var batch = history.older.splice(history.older.length - take, take);
          var mounted = [];
          for (var i = 0; i < batch.length; i++) {
            var block = blockFromSerialized(batch[i]);
            if (block) mounted.push(block);
          }
          prependBlocks(mounted);
          if (!history.older.length) history.atStart = true;
          updateHistoryMarker();
          history.loading = false;
        }

        // Decode every scrollback entry up front (cheap JSON), mount only the
        // newest tail, and keep the rest for scroll-up pagination.
        function ingestScrollback(scrollback, onProgress, onDone) {
          var rawBlocks = (scrollback && scrollback.blocks) || [];
          var entries = [];
          for (var i = 0; i < rawBlocks.length; i++) {
            var raw = rawBlocks[i].raw;
            if (!raw) continue;
            try {
              entries.push(JSON.parse(decodeUtf8(bytesFromJson(raw))));
            } catch (err) {
              /* skip corrupt entries */
            }
          }

          var visibleCount = Math.min(INITIAL_VISIBLE_BLOCKS, entries.length);
          history.older = entries.slice(0, Math.max(0, entries.length - visibleCount));
          history.atStart = history.older.length === 0;
          var toShow = entries.slice(entries.length - visibleCount);

          if (!toShow.length) {
            updateHistoryMarker();
            onDone();
            return;
          }

          var index = 0;
          function step() {
            var sliceStarted = performance.now();
            while (index < toShow.length && performance.now() - sliceStarted < 12) {
              var block = blockFromSerialized(toShow[index]);
              index++;
              if (block) appendBlock(block);
            }
            onProgress(index, toShow.length);
            if (index < toShow.length) requestAnimationFrame(step);
            else {
              updateHistoryMarker();
              onDone();
            }
          }
          requestAnimationFrame(step);
        }

        function blockFromSerialized(serialized) {
          var commandText = serialized.stylized_command
            ? decodeUtf8(bytesFromJson(serialized.stylized_command))
            : "";
          var outputText = serialized.stylized_output
            ? decodeUtf8(bytesFromJson(serialized.stylized_output))
            : "";
          if (!commandText.trim() && !outputText.trim()) return null;

          var block = new Block(commandText.trim() ? "command" : "raw");
          block.commandBuffer = bufferFromAnsi(commandText, 200);
          block.buffer = bufferFromAnsi(outputText, MAX_LINES);
          block.pwd = serialized.pwd || null;
          block.git = serialized.git_branch_name || serialized.git_head || null;
          block.exitCode =
            typeof serialized.exit_code === "number" ? serialized.exit_code : null;
          if (serialized.start_ts) {
            var started = Date.parse(serialized.start_ts);
            if (!isNaN(started)) block.startedAt = started;
          }
          if (serialized.completed_ts) {
            var finished = Date.parse(serialized.completed_ts);
            if (!isNaN(finished)) block.finishedAt = finished;
          }
          return block;
        }

        /* ----------------------------------------------------------------- */
        /* Transport                                                          */
        /* ----------------------------------------------------------------- */

        function setStatus(text, kind) {
          statusTextEl.textContent = text;
          statusEl.className = "pill" + (kind ? " " + kind : "");
        }

        function setSize(cols, rows) {
          sizeEl.textContent = cols && rows ? cols + "×" + rows : "";
          if (!cols || !rows) return;
          session.screen.resize(rows, cols);
          if (session.altScreen) {
            fitScreen();
            scheduleRender();
          }
        }

        function secretFromPath() {
          var parts = location.pathname.split("/").filter(Boolean);
          if (parts.length >= 2 && parts[0] === "local-session") return parts[1];
          return null;
        }

        var decoder = new TextDecoder("utf-8", { fatal: false });
        var joinedOnce = false;
        var closedByServer = false;
        var retryDelay = 1000;

        function sendJson(payload) {
          if (!transport.ws || transport.ws.readyState !== WebSocket.OPEN) return false;
          transport.ws.send(JSON.stringify(payload));
          return true;
        }

        function sendExecuteCommand(command) {
          return sendJson({
            // The hub routes on the socket's participant, not the buffer, so an
            // id we have not been told yet must not block the guest's command.
            ExecuteCommand: {
              buffer_id: transport.bufferId || "local-share",
              command: command,
            },
          });
        }

        function sendWriteToPty(bytes) {
          if (!transport.viewerId) return false;
          var seq = transport.ptySeq++;
          return sendJson({
            WriteToPty: {
              request_id: {
                participant_id: transport.viewerId,
                op_no: seq,
              },
              // serde for Vec<u8> accepts a number array.
              bytes: Array.from(bytes),
            },
          });
        }

        function guestDraft() {
          // contenteditable can insert NBSP and hard newlines; normalize both to
          // the plain shell text the host expects.
          return (ginputEl.textContent || "")
            .replace(/\u00a0/g, " ")
            .replace(/\n/g, "");
        }

        function submitGuestCommand() {
          var command = guestDraft();
          ginputEl.textContent = "";
          if (session.state === "running") {
            // A command already owns the PTY, so the line is stdin for it
            // rather than a new command to run.
            sendWriteToPty(
              Array.from(new TextEncoder().encode(command)).concat([0x0d])
            );
          } else {
            sendExecuteCommand(command);
          }
          scheduleRender();
        }

        function focusGuestInput() {
          if (guestBarEl.className === "off") return;
          ginputEl.focus();
        }

        guestBarEl.addEventListener("mousedown", function (event) {
          if (event.target === ginputEl) return;
          // Clicking the sigil, the hint or the padding should still put the
          // caret in the input rather than doing nothing.
          event.preventDefault();
          focusGuestInput();
        });

        ginputEl.addEventListener("keydown", function (event) {
          if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            submitGuestCommand();
            return;
          }
          if (event.ctrlKey && !event.metaKey && !event.altKey) {
            var code = event.key.toLowerCase().charCodeAt(0);
            if (code >= 97 && code <= 122) {
              event.preventDefault();
              sendWriteToPty([code - 96]);
            }
          }
        });

        // Typing anywhere on the page while nothing else is focused should land
        // in the guest's command line, the way it would in a terminal.
        document.addEventListener("keydown", function (event) {
          if (session.altScreen) return;
          if (event.metaKey || event.ctrlKey || event.altKey) return;
          if (event.target === ginputEl) return;
          if (event.key.length !== 1) return;
          focusGuestInput();
        });

        // Alt-screen / long-running apps need raw keystrokes on the host PTY.
        document.addEventListener("keydown", function (event) {
          if (!session.altScreen) return;
          if (event.metaKey || event.ctrlKey || event.altKey) {
            // Pass through a few common control chords.
            if (event.ctrlKey && !event.metaKey && !event.altKey) {
              var code = event.key.toLowerCase().charCodeAt(0);
              if (code >= 97 && code <= 122) {
                event.preventDefault();
                sendWriteToPty([code - 96]);
              }
            }
            return;
          }
          var bytes = null;
          if (event.key === "Enter") bytes = [0x0d];
          else if (event.key === "Backspace") bytes = [0x7f];
          else if (event.key === "Tab") bytes = [0x09];
          else if (event.key === "Escape") bytes = [0x1b];
          else if (event.key === "ArrowUp") bytes = [0x1b, 0x5b, 0x41];
          else if (event.key === "ArrowDown") bytes = [0x1b, 0x5b, 0x42];
          else if (event.key === "ArrowRight") bytes = [0x1b, 0x5b, 0x43];
          else if (event.key === "ArrowLeft") bytes = [0x1b, 0x5b, 0x44];
          else if (event.key.length === 1) {
            bytes = Array.from(new TextEncoder().encode(event.key));
          }
          if (!bytes) return;
          event.preventDefault();
          sendWriteToPty(bytes);
        });

        // The first scrollback ingest mounts history across several animation
        // frames. Anything that arrives meanwhile (replayed PTY frames, mirrored
        // agent turns) belongs *after* that history, but would be spliced into
        // the middle of it, so hold those messages until the ingest finishes.
        var ingestingHistory = false;
        var deferredMessages = [];

        function flushDeferredMessages() {
          ingestingHistory = false;
          var queued = deferredMessages;
          deferredMessages = [];
          for (var i = 0; i < queued.length; i++) handleMessage(queued[i]);
        }

        function handleMessage(msg) {
          if (ingestingHistory && !msg.JoinedSuccessfully) {
            deferredMessages.push(msg);
            return;
          }

          if (msg.LocalShareAgentExchange) {
            upsertAgentExchange(msg.LocalShareAgentExchange);
            return;
          }

          if (msg.LocalShareTypedInput) {
            session.typedInput =
              typeof msg.LocalShareTypedInput.text === "string"
                ? msg.LocalShareTypedInput.text
                : "";
            // Host typing implies the session is at the input editor even if we
            // have not yet seen a Precmd hook (e.g. joined mid-prompt).
            if (session.state !== "running") session.state = "prompt";
            scheduleRender();
            return;
          }

          if (msg.JoinedSuccessfully) {
            var joined = msg.JoinedSuccessfully;
            var size = joined.window_size || {};
            setSize(size.num_cols, size.num_rows);
            setStatus("live", "ok");
            retryDelay = 1000;
            transport.viewerId = joined.viewer_id || transport.viewerId;
            transport.bufferId = joined.init_block_id || transport.bufferId;
            guest.joined = true;
            if (!joinedOnce) {
              joinedOnce = true;
              var totalHistory =
                (joined.scrollback && joined.scrollback.blocks
                  ? joined.scrollback.blocks.length
                  : 0) || 0;
              progress.to(
                70,
                "Loading history…",
                totalHistory
                  ? "showing latest " +
                      Math.min(INITIAL_VISIBLE_BLOCKS, totalHistory) +
                      " of " +
                      totalHistory
                  : "no prior blocks"
              );
              ingestingHistory = true;
              ingestScrollback(
                joined.scrollback,
                function (done, total) {
                  progress.to(
                    70 + (total ? (done / total) * 30 : 30),
                    "Loading history…",
                    done + " / " + total + " visible"
                  );
                },
                function () {
                  flushDeferredMessages();
                  progress.done();
                  focusGuestInput();
                }
              );
            } else {
              appendDivider("— reconnected —");
            }
            scheduleRender();
            return;
          }

          if (msg.SessionEnded) {
            closedByServer = true;
            guest.joined = false;
            setStatus("session ended", "err");
            progress.fail("Session ended", "the host stopped sharing");
            appendDivider("— the host ended this session —");
            scheduleRender();
            return;
          }

          if (msg.FailedToJoin) {
            closedByServer = true;
            guest.joined = false;
            setStatus("join failed", "err");
            progress.fail("Could not join", "the share link may have been rotated");
            appendDivider("— could not join this session —");
            return;
          }

          var ordered = msg.OrderedTerminalEvent;
          if (!ordered || !ordered.event_type) return;
          var event = ordered.event_type;

          if (event.PtyBytesRead && event.PtyBytesRead.bytes) {
            try {
              var raw = lz4DecompressSizePrepended(
                bytesFromJson(event.PtyBytesRead.bytes)
              );
              terminal.write(decoder.decode(raw, { stream: true }));
              scheduleRender();
            } catch (err) {
              console.warn("failed to decode PtyBytesRead", err);
            }
            return;
          }

          if (event.CommandExecutionStarted && !session.hooksSeen) {
            // Fallback block boundaries for hosts whose shell isn't running
            // Warp's shell integration (raw ssh sessions, subshells, …).
            startCommandBlock("");
            return;
          }

          if (event.CommandExecutionFinished && !session.hooksSeen) {
            finishCommandBlock(null);
            if (event.CommandExecutionFinished.next_block_id) {
              transport.bufferId = event.CommandExecutionFinished.next_block_id;
            }
            return;
          }

          if (event.Resize && event.Resize.window_size) {
            setSize(
              event.Resize.window_size.num_cols,
              event.Resize.window_size.num_rows
            );
          }
        }

        function connect(wsUrl) {
          var ws = new WebSocket(wsUrl);
          transport.ws = ws;

          ws.addEventListener("open", function () {
            setStatus("joining…");
            progress.resume();
            progress.to(45, "Joining session…");
            ws.send(
              JSON.stringify({
                Initialize: {
                  viewer_id: null,
                  user_id: {
                    anonymous_id: randomUuid(),
                    firebase_id_token: null,
                  },
                  last_received_event_no: null,
                  latest_block_id: null,
                  telemetry_context: null,
                  feature_support: {},
                },
              })
            );
            progress.to(60, "Waiting for host…");
          });

          ws.addEventListener("message", function (event) {
            var msg;
            try {
              msg = JSON.parse(event.data);
            } catch (err) {
              return;
            }
            handleMessage(msg);
          });

          ws.addEventListener("close", function () {
            guest.joined = false;
            scheduleRender();
            if (closedByServer) return;
            setStatus("reconnecting…", "err");
            progress.retrying(retryDelay);
            setTimeout(function () {
              connect(wsUrl);
            }, retryDelay);
            retryDelay = Math.min(retryDelay * 2, 10000);
          });

          ws.addEventListener("error", function () {
            setStatus("connection error", "err");
            progress.fail("Connection error", "retrying shortly");
          });
        }

        async function boot() {
          var secret = secretFromPath();
          if (!secret) {
            setStatus("invalid share URL", "err");
            progress.fail("Invalid share URL", "expected /local-session/<secret>");
            return;
          }

          progress.to(10, "Fetching session info…");

          var wsUrl;
          try {
            var response = await fetch(
              "/local-session/" + encodeURIComponent(secret) + "/boot.json"
            );
            if (!response.ok) throw new Error("boot.json HTTP " + response.status);
            wsUrl = (await response.json()).ws_url;
            progress.to(30, "Opening connection…");
          } catch (err) {
            // Same-origin fallback when boot.json is unreachable.
            var scheme = location.protocol === "https:" ? "wss" : "ws";
            wsUrl = scheme + "://" + location.host + "/local-session/" + secret + "/ws";
            progress.to(30, "Opening connection…", "using derived WS URL");
            console.warn("boot.json failed, using derived ws URL", err);
          }

          connect(wsUrl);
        }

        boot();
      })();
    </script>
  </body>
</html>
